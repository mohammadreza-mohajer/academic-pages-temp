backend:
  name: github
  repo: mohammadreza-mohajer/academic-pages-temp
  branch: master

media_folder: "images/uploads"
public_folder: "/images/uploads"

site_url: "https://mohammadreza-mohajer.github.io/academic-pages-temp"

collections:
  - name: "posts"
    label: "Blog Posts"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Publish Date", name: "date", widget: "datetime"}
      - label: "Categories"
        name: "categories"
        widget: "list"
        default: ["Mathematics"]
      - label: "Tags"
        name: "tags"
        widget: "list"
      - {label: "Body", name: "body", widget: "markdown"}
