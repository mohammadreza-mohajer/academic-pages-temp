# Basic Site Settings
masthead_title: "Commonplace Book: Personal Notes and Thoughts"

remote_theme: "mmistakes/minimal-mistakes"
minimal_mistakes_skin: "air"

locale: "en-US"

title: "Mathematical Notes"
title_separator: "-"
name: "Mohammadreza Mohajer"
description: "Mathematical blog on analysis, partial differential equations, Sobolev spaces, and arithmetic geometry."

url: "https://mohammadreza-mohajer.github.io"
baseurl: "/academic-pages-temp"
repository: "mohammadreza-mohajer/academic-pages-temp"


# Author Information (Sidebar)
author:
  name: "Mohammadreza Mohajer"
  avatar: "profile.png"
  bio: "Mathematician working in analysis, partial differential equations, and arithmetic geometry."
  location: ""
  employer: "Cape Breton University"
  email: "Mohammadreza_Mohajer@cbu.ca"

  github: "mohammadreza-mohajer"
  googlescholar: "https://scholar.google.com/citations?hl=en&user=iSkpY_YAAAAJ"
  orcid: "https://orcid.org/0009-0004-7803-2528"
  researchgate: "https://www.researchgate.net/profile/Mohammadreza-Mohajer-2"


# Site Appearance
breadcrumbs: false
words_per_minute: 160
future: true

comments:
  provider: false


# SEO
google_site_verification:
bing_site_verification:

og_image:


# Analytics
analytics:
  provider: false


# Files
include:
  - _pages
  - files
  - blog.md
  - research.md
  - publications.md

exclude:
  - .github
  - Gemfile
  - README.md
  - LICENSE
  - node_modules
  - vendor


encoding: "utf-8"


# Markdown + LaTeX Support
markdown: kramdown

highlighter: rouge

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true


# MathJax
mathjax: true


# Collections
collections:
  pages:
    output: true


# Blog Posts
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      mathjax: true
      read_time: true
      comments: false
      share: false
      related: false

  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true


# Permalinks
permalink: /:year/:month/:day/:title/


# Sass
sass:
  sass_dir: _sass
  style: compressed


timezone: Etc/UTC


# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji


# RSS Feed
atom_feed:
  hide: false


# Archives
category_archive:
  type: liquid
  path: /categories/

tag_archive:
  type: liquid
  path: /tags/


# HTML Compression
compress_html:
  clippings: all
  ignore:
    envs: development
